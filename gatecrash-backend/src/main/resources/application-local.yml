spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # Quiet by default: printing every SQL statement (the overstay sweep alone runs one a minute)
    # flooded the terminal and cost noticeable CPU on smaller laptops. To see the SQL while
    # debugging, set org.hibernate.SQL to DEBUG (and com.gatecrash to DEBUG for app detail).
    com.gatecrash: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  bootstrap:
    # Seeds a block, four flats, a gate and one ready-to-use account per role (DevDataSeeder).
    # Idempotent, and never touches an account that already exists.
    seed-demo-data: true
  firebase:
    enabled: false          # no service account needed to develop locally; pushes are logged instead
  security:
    cors:
      allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8081

springdoc:
  api-docs:
    enabled: true
