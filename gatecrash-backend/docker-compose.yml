services:
  postgres:
    image: postgres:16-alpine
    container_name: gatecrash-postgres
    environment:
      POSTGRES_DB: gatecrash
      POSTGRES_USER: gatecrash
      POSTGRES_PASSWORD: gatecrash
    ports:
      - "5432:5432"
    volumes:
      - gatecrash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatecrash -d gatecrash"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gatecrash-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@gatecrash.local
      PGADMIN_DEFAULT_PASSWORD: gatecrash
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gatecrash-pgdata:
